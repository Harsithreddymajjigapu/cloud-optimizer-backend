name: Cloud Optimizer CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: cloud_optimizer_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest tests
        env:
          # +psycopg2 is required. SQLAlchemy 2.1 made a bare 'postgresql://'
          # mean psycopg3, which is not installed — CI failed with
          # ModuleNotFoundError: No module named 'psycopg'.
          DATABASE_URL: postgresql+psycopg2://postgres:password123@localhost:5432/cloud_optimizer_db
          CELERY_BROKER_URL: redis://localhost:6379/0
          GEMINI_API_KEY: ""          # empty on purpose: the tests must exercise
                                      # the rule-based fallback, never call the
                                      # real API, and never need a live key.
          SECRET_KEY: test_secret_key_123
          # A throwaway Fernet key for CI only. The real ENCRYPTION_KEY lives in
          # .env on the developer's machine and must never be committed or put
          # in a workflow file — anything encrypted with it would be readable by
          # anyone who can see this repo.
          ENCRYPTION_KEY: HjjFcNC_OtSMMTiAgFUonXp-HxXgNecLF7B5xyM-_gE=
        run: |
          python -m pytest tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t cloud-optimizer-backend .

      - name: Verify image built
        run: |
          docker images | grep cloud-optimizer-backend